# Despliegue automático en Render.com (gratis).
# En Render: New + → "Blueprint" → elige este repositorio → Apply.
# Crea la web y una base de datos PostgreSQL gratis, ya conectadas entre sí.
databases:
  - name: babyshower-db
    plan: free

services:
  - type: web
    name: invitacion-baby-shower
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: babyshower-db
          property: connectionString
      - key: HOST_KEY
        value: "mama2026"    # clave de anfitriona (la puedes cambiar luego en Render)
      - key: EVENT_TITLE
        value: "Baby Shower"
      - key: EVENT_BABY
        value: "Bastián Máximo"
      - key: EVENT_TAGLINE
        value: "Algo hermoso está por sucedernos"
      - key: EVENT_SUBTITLE
        value: "Acompáñanos a celebrar la llegada de nuestro pequeño 🌿"
      - key: EVENT_DATE
        value: "17 de Agosto, 2026 · 3:00 p.m."
      - key: EVENT_PLACE
        value: "Reserva de Madelena"
      - key: EVENT_HOSTS
        value: "Yesenia & Sebastián"
